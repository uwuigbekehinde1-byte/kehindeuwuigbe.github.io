<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#161f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <rect width="400" height="300" fill="url(#glow)"/>

  <!-- KPI tiles row -->
  <rect x="96" y="66" width="58" height="34" rx="7" fill="#161f33" stroke="#22304a" stroke-width="1.5"/>
  <rect x="163" y="66" width="58" height="34" rx="7" fill="#161f33" stroke="#22304a" stroke-width="1.5"/>
  <rect x="230" y="66" width="58" height="34" rx="7" fill="#161f33" stroke="#22304a" stroke-width="1.5"/>
  <rect x="103" y="76" width="30" height="6" rx="3" fill="#22d3ee" opacity="0.7"/>
  <rect x="170" y="76" width="30" height="6" rx="3" fill="#818cf8" opacity="0.7"/>
  <rect x="237" y="76" width="30" height="6" rx="3" fill="#22d3ee" opacity="0.7"/>
  <rect x="103" y="86" width="18" height="6" rx="3" fill="#67759a"/>
  <rect x="170" y="86" width="18" height="6" rx="3" fill="#67759a"/>
  <rect x="237" y="86" width="18" height="6" rx="3" fill="#67759a"/>

  <!-- bar chart -->
  <g fill="url(#accent)">
    <rect x="106" y="176" width="16" height="46" rx="2"/>
    <rect x="128" y="156" width="16" height="66" rx="2"/>
    <rect x="150" y="192" width="16" height="30" rx="2"/>
    <rect x="172" y="140" width="16" height="82" rx="2"/>
  </g>
  <line x1="98" y1="222" x2="196" y2="222" stroke="#22304a" stroke-width="2"/>

  <!-- donut chart -->
  <circle cx="256" cy="182" r="34" fill="none" stroke="#22304a" stroke-width="14"/>
  <circle cx="256" cy="182" r="34" fill="none" stroke="#22d3ee" stroke-width="14" stroke-dasharray="90 300" stroke-linecap="round" transform="rotate(-90 256 182)"/>
  <circle cx="256" cy="182" r="34" fill="none" stroke="#818cf8" stroke-width="14" stroke-dasharray="60 300" stroke-dashoffset="-90" stroke-linecap="round" transform="rotate(-90 256 182)"/>

  <text x="200" y="252" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#67759a">PROJECT 05</text>
  <text x="200" y="274" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e7ecf6">BI Dashboard Portfolio</text>
</svg>
