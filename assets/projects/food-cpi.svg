<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#161f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <rect width="400" height="300" fill="url(#glow)"/>

  <!-- rising trend line -->
  <polyline points="118,175 155,160 192,168 229,138 266,120 303,88" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="303,88 291,92 299,100" fill="#22d3ee"/>
  <circle cx="118" cy="175" r="4" fill="#818cf8"/>
  <circle cx="155" cy="160" r="4" fill="#818cf8"/>
  <circle cx="192" cy="168" r="4" fill="#818cf8"/>
  <circle cx="229" cy="138" r="4" fill="#818cf8"/>
  <circle cx="266" cy="120" r="4" fill="#818cf8"/>

  <!-- basket -->
  <path d="M158,196 L242,196 L232,236 C231,240 228,242 224,242 L176,242 C172,242 169,240 168,236 Z" fill="#161f33" stroke="url(#accent)" stroke-width="2.5"/>
  <path d="M172,196 C172,178 186,166 200,166 C214,166 228,178 228,196" fill="none" stroke="#93a1bd" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="212" x2="232" y2="212" stroke="#0c1220" stroke-width="2" opacity="0.5"/>
  <circle cx="185" cy="222" r="6" fill="#22d3ee" opacity="0.7"/>
  <circle cx="200" cy="226" r="6" fill="#818cf8" opacity="0.7"/>
  <circle cx="215" cy="222" r="6" fill="#22d3ee" opacity="0.7"/>

  <text x="200" y="266" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#67759a">PROJECT 03</text>
  <text x="200" y="288" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e7ecf6">Food Inflation Trends</text>
</svg>
