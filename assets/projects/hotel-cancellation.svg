<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#161f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <rect width="400" height="300" fill="url(#glow)"/>

  <!-- calendar -->
  <rect x="130" y="78" width="140" height="120" rx="12" fill="#161f33" stroke="url(#accent)" stroke-width="2.5"/>
  <rect x="130" y="78" width="140" height="30" rx="12" fill="url(#accent)"/>
  <rect x="130" y="96" width="140" height="12" fill="url(#accent)"/>
  <rect x="152" y="66" width="8" height="22" rx="4" fill="#93a1bd"/>
  <rect x="240" y="66" width="8" height="22" rx="4" fill="#93a1bd"/>

  <!-- calendar grid -->
  <g fill="#22d3ee" opacity="0.35">
    <rect x="146" y="120" width="16" height="16" rx="3"/>
    <rect x="170" y="120" width="16" height="16" rx="3"/>
    <rect x="194" y="120" width="16" height="16" rx="3"/>
    <rect x="218" y="120" width="16" height="16" rx="3"/>
    <rect x="242" y="120" width="16" height="16" rx="3"/>
    <rect x="146" y="146" width="16" height="16" rx="3"/>
    <rect x="170" y="146" width="16" height="16" rx="3"/>
    <rect x="218" y="146" width="16" height="16" rx="3"/>
    <rect x="242" y="146" width="16" height="16" rx="3"/>
    <rect x="146" y="172" width="16" height="16" rx="3"/>
    <rect x="170" y="172" width="16" height="16" rx="3"/>
    <rect x="194" y="172" width="16" height="16" rx="3"/>
    <rect x="242" y="172" width="16" height="16" rx="3"/>
  </g>
  <!-- cancelled day -->
  <rect x="194" y="146" width="16" height="16" rx="3" fill="#f87171"/>
  <path d="M196,148 L208,160 M208,148 L196,160" stroke="#0c1220" stroke-width="2" stroke-linecap="round"/>

  <!-- declining trend bars -->
  <g fill="#818cf8" opacity="0.85">
    <rect x="288" y="150" width="12" height="48" rx="2"/>
    <rect x="306" y="164" width="12" height="34" rx="2"/>
    <rect x="324" y="176" width="12" height="22" rx="2"/>
    <rect x="342" y="186" width="12" height="12" rx="2"/>
  </g>

  <text x="200" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#67759a">PROJECT 02</text>
  <text x="200" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e7ecf6">Booking Cancellations</text>
</svg>
