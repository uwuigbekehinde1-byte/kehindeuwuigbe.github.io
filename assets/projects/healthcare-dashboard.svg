<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#161f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <rect width="400" height="300" fill="url(#glow)"/>

  <!-- network / access lines -->
  <line x1="200" y1="108" x2="122" y2="86" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="108" x2="284" y2="92" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="108" x2="150" y2="192" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="108" x2="268" y2="180" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <circle cx="122" cy="86" r="5" fill="#818cf8" opacity="0.8"/>
  <circle cx="284" cy="92" r="5" fill="#818cf8" opacity="0.8"/>
  <circle cx="150" cy="192" r="5" fill="#818cf8" opacity="0.8"/>
  <circle cx="268" cy="180" r="5" fill="#818cf8" opacity="0.8"/>

  <!-- location pin -->
  <path d="M200,182 C176,150 158,131 158,109 A42,42 0 1 1 242,109 C242,131 224,150 200,182 Z" fill="url(#accent)"/>
  <circle cx="200" cy="108" r="20" fill="#0c1220"/>

  <!-- pulse line inside pin -->
  <polyline points="188,108 194,108 198,98 203,118 207,108 213,108" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="200" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#67759a">PROJECT 01</text>
  <text x="200" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e7ecf6">Healthcare Access</text>
</svg>
